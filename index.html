<!DOCTYPE html>
<html>
<head>
  <title>270 Degree Rube Goldberg Machine</title>

 <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.x/dist/aframe-physics-system.min.js"></script> 
</head>

<body>
<a-scene physics="gravity: -9.8">

 
  <a-sky color="#17233d"></a-sky>

  <a-plane position="0 -4 0"
    rotation="-90 0 0"
    width="100" height="100"wwww
    color="#64748b"
    static-body>
  </a-plane>
  
  <a-plane position="-5 -20 0"
    rotation="-90 0 0"
    width="100" height="100"wwww
    color="#64748b"
    static-body>
  </a-plane>


   
    <a-camera position="0 2 10"></a-camera>
 
<a-box position="55 30 -3"
    rotation="0 90 0"
    width="20" height="25" depth="5"
    color="#f97316"
    static-body>
  </a-box>

  <a-box position="-7 15 -3"
    rotation="0 0 -18"
    width="20" height="1" depth="5"
    color="#f97316"
    static-body>
  </a-box>

  <a-box position="19 4 -6"
    rotation="0 0 18"
    width="70" height="1" depth="9"
    color="red"
    static-body>
  </a-box>
  
   <a-box position="-49 1 -6"
    rotation="0 90 0"
    width="10" height="10" depth="1"
    color="red"
    dynamic-body>
  </a-box>
  
  <a-box position="-45 1 -6"
    rotation="0 90 0"
    width="10" height="10" depth="1"
    color="red"
    dynamic-body>
  </a-box>
  
  <a-box position="-41 1 -6"
    rotation="0 90 0"
    width="10" height="10" depth="1"
    color="red"
    dynamic-body>
  </a-box>

<a-box position="-36 1 -6"
    rotation="0 90 0"
    width="10" height="10" depth="1"
    color="red"
    dynamic-body>
  </a-box>
  

 


<!-- Ball -->
<a-sphere position="-7 22 -3"
  radius="2"
  color="#fb7185"
  dynamic-body="mass: 0.5">
</a-sphere>

<a-sphere position="-7 20 -3"
  radius="2"
  color="#fb7185"
  dynamic-body="mass: 0.5">
</a-sphere>

<a-sphere position="-7 24 -3"
  radius="2"
  color="#fb7185"
  dynamic-body="mass: 0.5">
</a-sphere>

<a-sphere position="-7 26 -3"
  radius="2"
  color="#fb7185"
  dynamic-body="mass: 0.5">
</a-sphere>


  


 

  

</a-scene>
</body>
</html>
